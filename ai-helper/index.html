<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qadam AI Assistant</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#fcfcfd] text-slate-800 h-screen flex font-sans overflow-hidden">

  <!-- Left Sidebar (Claude Style Minimalist) -->
  <div class="w-64 bg-[#f8fafc] border-r border-slate-200 flex flex-col p-3 gap-2">

    <!-- Top Left Logo Container -->
    <div class="p-2 border-b border-slate-200 flex items-center justify-between">
      <img id="sidebarLogo" src="sTRIGHT.LOGO.png" alt="Hawks Global" class="h-8 object-contain">
      <button class="text-slate-400 hover:text-slate-600 text-sm"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- New Chat Button -->
    <button onclick="startNewChat()" class="mt-2 w-full bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold py-2.5 px-3 rounded-lg flex items-center gap-2 shadow-sm transition-all">
      <i class="fa-solid fa-plus text-slate-500"></i>
      <span>New Chat</span>
    </button>

    <!-- Chat History List -->
    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mt-4 px-2">Recent Tasks</div>
    <div id="historyList" class="flex-1 overflow-y-auto space-y-1 text-xs text-slate-600">
      <div class="p-2 hover:bg-slate-200/60 rounded-md cursor-pointer truncate">Financial Strategy Consult</div>
      <div class="p-2 hover:bg-slate-200/60 rounded-md cursor-pointer truncate">FBR Tax Form Queries</div>
    </div>

    <!-- User Account Footer -->
    <div class="border-t border-slate-200 pt-3 flex items-center justify-between px-2 text-xs text-slate-600">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full bg-slate-300 text-slate-700 font-bold flex items-center justify-center text-[10px]">A</div>
        <span class="font-medium truncate">Aleem</span>
      </div>
      <i class="fa-solid fa-ellipsis text-slate-400"></i>
    </div>
  </div>

  <!-- Main Chat Workspace -->
  <div class="flex-1 flex flex-col items-center justify-between relative bg-[#fcfcfd]">

    <!-- Center Hero Greeting (Initial View) -->
    <div id="greetingContainer" class="flex-1 flex flex-col items-center justify-center gap-3 text-center px-4 -mt-16">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-serif text-slate-800 tracking-tight">Afternoon, Sir</h1>
        <!-- Center Logo -->
        <img id="centerLogo" src="1stlogo.png.png" alt="Logo" class="h-9 w-9 object-contain">
      </div>
      <p class="text-xs text-slate-400">How can Qadam AI assist you today?</p>
    </div>

    <!-- Active Chat Messages Window -->
    <div id="chatMessages" class="hidden flex-1 w-full max-w-2xl overflow-y-auto p-6 space-y-6"></div>

    <!-- Bottom Input Box -->
    <div class="w-full max-w-2xl p-4 mb-3">
      <div class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm focus-within:border-slate-400 focus-within:shadow-md transition-all">

        <!-- Input Area -->
        <textarea 
          id="userPrompt" 
          rows="2"
          class="w-full bg-transparent border-none outline-none resize-none text-slate-800 text-sm placeholder-slate-400" 
          placeholder="Message Qadam AI..."
        ></textarea>

        <div class="flex items-center justify-between border-t border-slate-100 pt-2 mt-1">
          <div class="flex items-center gap-2">
            <!-- Paperclip Button & Hidden Input -->
            <label for="fileUpload" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
              <i class="fa-solid fa-paperclip text-sm"></i>
            </label>
            <input type="file" id="fileUpload" class="hidden" accept="image/*,.pdf,.txt,.doc,.docx">
            
            <span class="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full border border-slate-200 font-medium">Qadam Engine</span>
          </div>

          <!-- Send Button -->
          <button onclick="handleSend()" class="bg-slate-800 hover:bg-slate-900 text-white w-8 h-8 rounded-lg flex items-center justify-center transition-all shadow-sm">
            <i class="fa-solid fa-arrow-up text-xs"></i>
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- JavaScript Scripts Inclusion -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
